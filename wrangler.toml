name = "atlas-ai"
compatibility_date = "2024-09-01"
pages_build_output_dir = "./dist"

# Build command: npm run build
# Output directory: dist/
# Node version: 20 (default)

[vars]
# Non-sensitive public variables go here
# VITE_APP_NAME = "Atlas AI"

# Secrets — set via `wrangler pages secret put <KEY>` or Cloudflare dashboard:
# VITE_CONVEX_URL
# CONVEX_SITE_URL (set to your Cloudflare Pages URL)
# DODO_PAYMENTS_API_KEY
# DODO_WEBHOOK_SECRET
# JWT_PRIVATE_KEY
# JWT_PUBLIC_KEY
# JWKS

# Environment: production (preview uses --env flag)
[env.production]
# vars = { ENVIRONMENT = "production" }

[env.preview]
# vars = { ENVIRONMENT = "preview" }
